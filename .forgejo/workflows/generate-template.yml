name: Generate template

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generate:
    name: Verify the template generates a valid tree
    runs-on: docker
    container:
      image: python:3.12-slim
    steps:
      - name: Check out the template
        uses: actions/checkout@v4

      - name: Install cookiecutter and python-slugify
        run: |
          apt-get update && apt-get install -y --no-install-recommends jq
          python -m pip install --no-cache-dir cookiecutter python-slugify

      - name: Generate a project from the template
        run: cookiecutter --no-input . -o generated

      - name: Derive the expected slug from the template default
        id: slug
        run: |
          set -e
          project_name="$(jq -r '.project_name' cookiecutter.json)"
          slug="$(python -c "from slugify import slugify; print(slugify('$project_name'))")"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "project_name=$project_name" >> "$GITHUB_OUTPUT"

      - name: Verify the expected files and folders exist
        env:
          EXPECTED_SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          set -e
          root="generated/$EXPECTED_SLUG"

          test -f "$root/README.md"
          test -f "$root/CONVENTIONS.md"
          test -f "$root/proposal.md"
          test -f "$root/specs/SPEC-0001-system-overview.md"
          test -f "$root/todos/TODO-0001-initial-validation.md"
          test -f "$root/templates/adr.md"
          test -f "$root/templates/research-note.md"
          test -f "$root/templates/specification.md"
          test -f "$root/templates/todo-list.md"
          test -f "$root/.devcontainer/devcontainer.json"
          test -f "$root/.devcontainer/Dockerfile"
          test -f "$root/.gitignore"

          test -d "$root/adrs"
          test -d "$root/research"
          test -d "$root/archive/adrs"
          test -d "$root/archive/research"
          test -d "$root/archive/specs"
          test -d "$root/archive/todos"

      - name: Verify the folder name was slugified with dashes
        env:
          EXPECTED_SLUG: ${{ steps.slug.outputs.slug }}
          PROJECT_NAME: ${{ steps.slug.outputs.project_name }}
        run: |
          test -d "generated/$EXPECTED_SLUG"
          test ! -e "generated/$PROJECT_NAME"
